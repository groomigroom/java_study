<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@PostMapping</title>
</head>

<body>
    <h1>@PostMapping</h1>
    <pre>
        @RequestMapping

        웹 주소(URL)를 이 컨트롤러나 기능과 연결(매핑)해 줍니다.
        사용자가 특정 주소로 찾아왔을 때 어떤 코드가 실행될지 정해 줍니다.
        
        예시
        
        @RequestMapping("/")
        --> localhost:8080 일 때,
        @RequestMapping("/bye")

    </pre>
</body>

</html>
